[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "captureflow"
version = "0.1.0"
description = "A bounded local capture inbox."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2,<2.0",
    "openai>=1.0,<3.0",
    "pydantic>=2.0,<3.0",
    "streamlit>=1.40,<2.0",
    "tzlocal>=5.0,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
